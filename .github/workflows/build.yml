name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.3.3
          cache-disabled: true
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          # Каждая ошибка компиляции появится отдельной красной строкой в Annotations
          grep -E "error:|FAILURE|What went wrong|Mixin|Exception" -A3 build.log | head -n 120 > errors.txt || true
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < errors.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: waraxvisuals
          path: build/libs/*.jar
